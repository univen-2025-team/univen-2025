services:
  # (Compose v2 ignores `version:`; keep file simple and rely on default .env loading)
  # =============================================================================
  # Infrastructure Services
  # =============================================================================

  minio:
    image: minio/minio
    container_name: univen-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - univen-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3

  # =============================================================================
  # Application Services
  # =============================================================================

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: univen-server
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      SERVER_PORT: 4000
      # External Services - provided by .env
      MONGODB_URI: ${MONGODB_URI}
      DB_URL: ${MONGODB_URI}
      REDIS_URL: ${REDIS_URL}
      HOST: 0.0.0.0
      CLIENT_URL: ${NEXT_PUBLIC_APP_URL:-https://www.univen-1111.duckdns.org}
      VNSTOCK_API_URL: ${VNSTOCK_API_URL:-http://vnstock-api:8000}
    ports:
      # Bind to localhost only, let Nginx handle external traffic
      - "4000:4000"
    volumes:
      - ./server/logs:/app/logs
      - ./server/public:/app/public
    networks:
      - univen-network
    # No local mongodb/redis dependency anymore
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"require('http').get('http://localhost:4000/v1/api/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\"" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  vnstock-api:
    build:
      context: ./vnstock-api
      dockerfile: Dockerfile
    container_name: univen-vnstock-api
    restart: unless-stopped
    environment:
      MONGODB_URI: ${MONGODB_URI}
      CRONJOB_ENABLED: ${CRONJOB_ENABLED:-true}
      VNSTOCK_SOURCE: ${VNSTOCK_SOURCE:-TCBS}
      VNSTOCK_API_KEY: ${VNSTOCK_API_KEY:-}
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
    ports:
      - "8000:8000"
    networks:
      - univen-network
    depends_on:
      server:
        condition: service_healthy

# =============================================================================
# Networks
# =============================================================================

networks:
  univen-network:
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================

volumes:
  minio_data:
    driver: local
