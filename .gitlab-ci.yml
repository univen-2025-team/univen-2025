include:
  - project: tvconss/gitlab-tools
    ref: main
    file: sync-to-github/.gitlab-ci.yml

variables:
  GITHUB_REPO: "univen-2025"

stages:
  - sync-to-github
  - deploy

deploy_api:
  stage: deploy
  image: docker:latest
  tags:
    - docker
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
  variables:
    GIT_SUBMODULE_STRATEGY: none
    DEPLOY_PATH: "/opt/apps/univen-2025"
    DOCKER_HOST: unix:///var/run/docker.sock

  before_script:
    - apk add --no-cache rsync git docker-cli-compose

  script:
    - echo "Cloning submodules via CI_JOB_TOKEN..."
    - rm -rf server vnstock-api client
    - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.trancondev.site/tvconss/univen-2025_server.git server
    - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.trancondev.site/tvconss/univen-2025_vnstock-api.git vnstock-api
    - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.trancondev.site/tvconss/univen-2025_client.git client

    - |
      echo "Creating environment variables files from GitLab File variables..."
      [ -n "$ENV_FILE" ] && cp "$ENV_FILE" ./.env || echo "Warning: ENV_FILE not set"
      [ -n "$ENV_SERVER_FILE" ] && cp "$ENV_SERVER_FILE" ./server/.env.production || echo "Warning: ENV_SERVER_FILE not set"
      [ -n "$ENV_VNSTOCK_API_FILE" ] && cp "$ENV_VNSTOCK_API_FILE" ./vnstock-api/.env || echo "Warning: ENV_VNSTOCK_API_FILE not set"
      [ -n "$ENV_CLIENT_FILE" ] && cp "$ENV_CLIENT_FILE" ./client/.env.production || echo "Warning: ENV_CLIENT_FILE not set"

    - |
      echo "Validating environment files in CI workspace..."
      validate_env() {
        F=$1
        echo "Checking $F..."
        [ -f "$F" ] || { echo "Error: $F missing"; exit 1; }
        [ -s "$F" ] || { echo "Error: $F empty"; exit 1; }
        ls -lh "$F"
      }
      validate_env "./.env"
      validate_env "./server/.env.production"
      validate_env "./vnstock-api/.env"
      validate_env "./client/.env.production"
    
    # 4. Sync files ra thư mục deploy độc lập (giữ lại .env bên đó)
    - echo "Syncing files to $DEPLOY_PATH..."
    - mkdir -p $DEPLOY_PATH
    - rsync -av --delete --exclude '.git' ./ $DEPLOY_PATH/
    
    # 5. Phân quyền bảo mật file .env (Chỉ chủ sở hữu được đọc/ghi - Chống lộ lọt log cho dev)
    - echo "Securing environment variables files on VPS..."
    - |
      FILES="$DEPLOY_PATH/.env $DEPLOY_PATH/server/.env.production $DEPLOY_PATH/vnstock-api/.env $DEPLOY_PATH/client/.env.production"
      chmod 600 $FILES || true
      echo "Verifying permissions and ownership at deployment path..."
      for F in $FILES; do
        if [ -f "$F" ]; then
          ls -l "$F"
          PERM=$(stat -c "%a" "$F")
          if [ "$PERM" != "600" ]; then
            echo "Warning: $F has incorrect permissions: $PERM"
          fi
        fi
      done

    # 6. Xóa các file .env chứa thông tin nhạy cảm ở workspace CI để tránh rò rỉ trong log cache
    - echo "Cleaning up sensitive files from CI workspace..."
    - rm -f ./.env ./server/.env.production ./vnstock-api/.env ./client/.env.production
    
    # 7. Chạy docker compose tại thư mục DEPLOY_PATH
    - echo "Starting deployment via Docker Compose..."
    - cd $DEPLOY_PATH
    - docker compose --env-file ./.env -f docker-compose.prod.yml down --remove-orphans || true
    - echo "Building Docker images without cache..."
    - docker compose --env-file ./.env -f docker-compose.prod.yml build mongodb redis server vnstock-api client
    - echo "Starting services..."
    - docker compose --env-file ./.env -f docker-compose.prod.yml up -d
    
    - echo "Deployment completed securely!"
