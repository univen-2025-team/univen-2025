include:
  - project: tvconss/gitlab-tools
    ref: main
    file: sync-to-github/.gitlab-ci.yml

variables:
  GITHUB_REPO: "univen-2025"

stages:
  - sync-to-github
  - deploy

deploy_job:
  stage: deploy
  tags:
    - shell 
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
  variables:
    GIT_SUBMODULE_STRATEGY: none
  before_script: []

  script:
    - echo "Updating submodule code via HTTPS with token..."
    - rm -rf server vnstock-api
    - git clone https://oauth2:${GITLAB_CLONE_TOKEN}@gitlab.trancondev.site/tvconss/univen-2025_server.git server
    - git clone https://oauth2:${GITLAB_CLONE_TOKEN}@gitlab.trancondev.site/tvconss/univen-2025_vnstock-api.git vnstock-api

    
    # 1. Tạo file .env cho dự án gốc (docker-compose) từ các biến bắt đầu bằng APP_
    - echo "Generating root environment variables..."
    - printenv | grep '^APP_' | sed 's/^APP_//' > ./.env
    
    # 2. Tạo file .env cho server từ các biến bắt đầu bằng SERVER_
    - echo "Generating server environment variables..."
    - printenv | grep '^SERVER_' | sed 's/^SERVER_//' > ./server/.env.production
    
    # 3. Tạo file .env cho vnstock-api từ các biến bắt đầu bằng VNSTOCK_API_
    - echo "Generating vnstock-api environment variables..."
    - printenv | grep '^VNSTOCK_API_' | sed 's/^VNSTOCK_API_//' > ./vnstock-api/.env
    
    # 4. Chạy docker-compose để build và deploy
    - echo "Starting deployment via Docker Compose..."
    - docker-compose -f docker-compose.prod.yml up -d --build mongodb redis server vnstock-api
    
    # 5. Xóa các file .env chứa thông tin nhạy cảm
    - echo "Cleaning up sensitive environment files..."
    - rm -f ./.env
    - rm -f ./server/.env.production
    - rm -f ./vnstock-api/.env
    - echo "Deployment completed securely!"
