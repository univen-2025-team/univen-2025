include:
  - project: tvconss/gitlab-tools
    ref: main
    file: sync-to-github/.gitlab-ci.yml

variables:
  GITHUB_REPO: "univen-2025"

stages:
  - sync-to-github
  - deploy

deploy_job:
  stage: deploy
  tags:
    - shell 
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
  variables:
    GIT_SUBMODULE_STRATEGY: none
    DEPLOY_PATH: "/opt/apps/univenture-2025"

  script:
    - echo "Cloning submodules via CI_JOB_TOKEN..."
    - rm -rf server vnstock-api
    - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.trancondev.site/tvconss/univen-2025_server.git server
    - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.trancondev.site/tvconss/univen-2025_vnstock-api.git vnstock-api

    # 1. Tạo file .env cho dự án gốc (docker-compose) từ các biến bắt đầu bằng APP_
    - echo "Generating root environment variables..."
    - printenv | grep '^APP_' | sed 's/^APP_//' > ./.env || touch ./.env
    
    # 2. Tạo file .env cho server từ các biến bắt đầu bằng SERVER_
    - echo "Generating server environment variables..."
    - printenv | grep '^SERVER_' | sed 's/^SERVER_//' > ./server/.env.production || touch ./server/.env.production
    
    # 3. Tạo file .env cho vnstock-api từ các biến bắt đầu bằng VNSTOCK_API_
    - echo "Generating vnstock-api environment variables..."
    - printenv | grep '^VNSTOCK_API_' | sed 's/^VNSTOCK_API_//' > ./vnstock-api/.env || touch ./vnstock-api/.env
    
    # 4. Sync files ra thư mục deploy độc lập (giữ lại .env bên đó)
    - echo "Syncing files to $DEPLOY_PATH..."
    - mkdir -p $DEPLOY_PATH
    - rsync -av --delete --exclude '.git' ./ $DEPLOY_PATH/
    
    # 5. Xóa các file .env chứa thông tin nhạy cảm ở workspace CI để tránh rò rỉ trong log cache
    - echo "Cleaning up sensitive files from CI workspace..."
    - rm -f ./.env ./server/.env.production ./vnstock-api/.env
    
    # 6. Chạy docker compose tại thư mục DEPLOY_PATH
    - echo "Starting deployment via Docker Compose..."
    - cd $DEPLOY_PATH
    - docker compose -f docker-compose.prod.yml down --remove-orphans || true
    - docker compose -f docker-compose.prod.yml up -d --build mongodb redis server vnstock-api
    
    - echo "Deployment completed securely!"
