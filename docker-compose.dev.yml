# Development Docker Compose - Standalone
# Usage: docker compose -f docker-compose.dev.yml up
# Note: Client chạy riêng bên ngoài Docker (npm run dev trong folder client)

services:
  # =============================================================================
  # Infrastructure Services
  # =============================================================================

  puppeteer:
    image: browserless/chrome:latest
    container_name: univen-puppeteer
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      # Use a token if needed, or leave empty for no auth. 
      # Keeping it open for internal dev network.
      - CONNECTION_TIMEOUT=60000
    networks:
      - univen-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/" ]
      interval: 30s
      timeout: 10s
      retries: 3

  mongodb-dev:
    image: mongo:7
    container_name: univen-mongodb-dev
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data_dev:/data/db
    networks:
      - univen-network
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:alpine
    container_name: univen-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - univen-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================================
  # Application Services (Development Mode - Hot Reload)
  # =============================================================================

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: univen-server-dev
    restart: unless-stopped

    environment:
      - TZ=Asia/Ho_Chi_Minh
    ports:
      - "4000:4000"
    volumes:
      - ./server:/app
      - /app/node_modules
    networks:
      - univen-network
    depends_on:
      mongodb-dev:
        condition: service_healthy
      redis:
        condition: service_healthy

  vnstock-api:
    build:
      context: ./vnstock-api
      dockerfile: Dockerfile.dev
    container_name: univen-vnstock-api-dev
    restart: unless-stopped
    environment:
      MONGODB_URI: ${MONGODB_URI_DEV}
      CRONJOB_ENABLED: "false"
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
      TZ: Asia/Ho_Chi_Minh
    command: python -u src/watcher.py
    volumes:
      - ./vnstock-api:/app
    networks:
      - univen-network
    depends_on:
      mongodb-dev:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 8.8.4.4

# =============================================================================
# Networks
# =============================================================================

networks:
  univen-network:
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================

volumes:
  mongodb_data_dev:
    driver: local
  redis_data:
    driver: local
