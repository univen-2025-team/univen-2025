# Docker Compose cho Windows
# Usage: docker compose -f docker-compose.windows.yml up
#
# Lưu ý: File này được tối ưu cho Windows với các fix:
# - MongoDB healthcheck đơn giản hơn
# - API URL dùng localhost cho browser access
# - Network configuration tương thích Windows

services:
  # (Compose v2 ignores `version:`; keep file simple and rely on default .env loading)
  # =============================================================================
  # Infrastructure Services
  # =============================================================================

  mongodb:
    image: mongo:7
    container_name: univen-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-password123}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-do_an_1}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - univen-network
    healthcheck:
      # Simplified healthcheck for Windows - không cần connection string
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:alpine
    container_name: univen-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - univen-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: univen-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - univen-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3

  # =============================================================================
  # Application Services
  # =============================================================================

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: univen-server
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 4000
      SERVER_PORT: 4000
      # Dùng service name trong Docker network
      MONGODB_URI: ${MONGODB_URI:-mongodb://admin:password123@mongodb:27017/univen2025?authSource=admin}
      DB_URL: ${MONGODB_URI:-mongodb://admin:password123@mongodb:27017/univen2025?authSource=admin}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      HOST: 0.0.0.0
      CLIENT_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      # Enable file watching in Docker
      CHOKIDAR_USEPOLLING: "true"
    ports:
      # Always map to 4000 to match NEXT_PUBLIC_API_URL
      - "4000:4000"
    volumes:
      # Mount source code for hot reload
      - ./server:/app
      - /app/node_modules
      - ./server/logs:/app/logs
      - ./server/public:/app/public
    networks:
      - univen-network
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Dùng node để check health endpoint (node:22-alpine không có wget/curl)
      # Health endpoint ở /v1/api/health, container internal port is always 4000
      test: [ "CMD-SHELL", "node -e \"require('http').get('http://localhost:4000/v1/api/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\"" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
      args:
        # Build time args for Next.js (NEXT_PUBLIC_ vars must be set at build time)
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/v1/api}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_AGENT_API: ${NEXT_PUBLIC_AGENT_API:-}
        NEXT_PUBLIC_AGENT_HF: ${NEXT_PUBLIC_AGENT_HF:-}
    container_name: univen-client
    restart: unless-stopped
    environment:
      NODE_ENV: development
      # Runtime env (only works for server-side, NEXT_PUBLIC_ need rebuild)
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/v1/api}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_AGENT_API: ${NEXT_PUBLIC_AGENT_API:-}
      NEXT_PUBLIC_AGENT_HF: ${NEXT_PUBLIC_AGENT_HF:-}
      # Server-side env (không cần NEXT_PUBLIC_ prefix)
      HF_TOKEN: ${HF_TOKEN:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      # Enable file watching in Docker
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${CUSTOMER_PORT:-3000}:3000"
    volumes:
      # Mount source code for hot reload
      - ./client:/app
      - /app/node_modules
      - /app/.next
    networks:
      - univen-network
    depends_on:
      server:
        condition: service_healthy

  vnstock-api:
    build:
      context: ./vnstock-api
      dockerfile: Dockerfile
    container_name: univen-vnstock-api
    restart: unless-stopped
    environment:
      # Dùng service name trong Docker network
      MONGODB_URI: ${MONGODB_URI:-mongodb://admin:password123@mongodb:27017/univen2025?authSource=admin}
      # Override .env file trong container để khớp với server
      MONGO_INITDB_DATABASE: univen2025
      CRONJOB_ENABLED: ${CRONJOB_ENABLED:-true}
      VNSTOCK_SOURCE: ${VNSTOCK_SOURCE:-TCBS}
      VNSTOCK_API_KEY: ${VNSTOCK_API_KEY:-}
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
      REDIS_URL: redis://redis:6379
    ports:
      - "8000:8000"
    networks:
      - univen-network
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      # server:  # Commented out - vnstock-api can run independently
      #   condition: service_healthy

# =============================================================================
# Networks
# =============================================================================

networks:
  univen-network:
    driver: bridge
    # Windows-compatible network settings
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16

# =============================================================================
# Volumes
# =============================================================================

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
